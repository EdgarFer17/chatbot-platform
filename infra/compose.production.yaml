services:
  database:
    restart: unless-stopped
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: chatbot_platform
      POSTGRES_USER: chatbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD hexadecimal no .env}
    volumes:
      - chatbot_platform_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot -d chatbot_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    restart: unless-stopped
    build:
      context: ../backend
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://chatbot:${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD hexadecimal no .env}@database:5432/chatbot_platform
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Configure JWT_SECRET_KEY no arquivo .env}
      ADMIN_MASTER_KEY: ${ADMIN_MASTER_KEY:?Configure ADMIN_MASTER_KEY no arquivo .env}
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-700}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-35}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-low}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Configure as origens HTTPS}
      CONVERSATION_CONTEXT_MESSAGES: 6
      CONVERSATION_CONTEXT_CHARACTERS: 8000
    ports:
      - "127.0.0.1:8010:8000"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12

  worker:
    restart: unless-stopped
    build:
      context: ../backend
    command: ["python", "-m", "app.worker"]
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://chatbot:${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD hexadecimal no .env}@database:5432/chatbot_platform
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Configure JWT_SECRET_KEY no arquivo .env}
      ADMIN_MASTER_KEY: ${ADMIN_MASTER_KEY:?Configure ADMIN_MASTER_KEY no arquivo .env}
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
    depends_on:
      database:
        condition: service_healthy
      backend:
        condition: service_healthy

  admin:
    restart: unless-stopped
    build:
      context: ../admin
    environment:
      PLATFORM_API_URL: http://backend:8000
      PLATFORM_PUBLIC_API_URL: ${PLATFORM_PUBLIC_API_URL:?Configure a URL HTTPS da API}
      WIDGET_PUBLIC_URL: ${WIDGET_PUBLIC_URL:?Configure a URL HTTPS do painel}
      ADMIN_MASTER_KEY: ${ADMIN_MASTER_KEY:?Configure ADMIN_MASTER_KEY no arquivo .env}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Configure a senha de producao}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?Configure ADMIN_SESSION_SECRET no arquivo .env}
      ADMIN_COOKIE_SECURE: "true"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      PANEL_DOMAIN: ${PANEL_DOMAIN:?Configure PANEL_DOMAIN}
      API_DOMAIN: ${API_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./${CADDY_CONFIG:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - admin
      - backend

volumes:
  caddy_data:
  caddy_config:
  chatbot_platform_postgres:
